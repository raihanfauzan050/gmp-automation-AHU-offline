services:
  ocr:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "deepseek_ocr.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HF_HOME: /models
    volumes:
      - model_cache:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

  app:
    build: .
    restart: unless-stopped
    command: ["gunicorn", "--workers", "1", "--bind", "0.0.0.0:5000", "--timeout", "600", "app:app"]
    ports:
      - "${HOST_PORT:-5002}:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      DEEPSEEK_OCR_ENDPOINT: http://ocr:8000
    depends_on:
      ocr:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/offline')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  model_cache:
  uploads:
  outputs:
